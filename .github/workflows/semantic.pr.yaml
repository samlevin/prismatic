###
# Enforces angular commit conventions in PR titles to auto-generate release
# notes when Semantic Release is run
###

name: 'Semantic PR'

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  semantic_pr:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
