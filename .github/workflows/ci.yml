name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'samlevin/prismatic'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install
        run: npm ci
      - name: Generated agent definitions are current
        run: npm run agents:check
      - name: Test
        run: node --test scripts/*.test.mjs
