name: 'Tracker: reconcile issue states'
run-name: "Reconcile issue states (${{ github.event_name == 'issues' && format('issue #{0} {1}', github.event.issue.number, github.event.action) || github.event_name }})"

on:
  issues:
    types: [reopened, closed, labeled, unlabeled]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview metadata and container completion without writes
        type: boolean
        default: true

permissions:
  contents: read

# One group per issue, so a burst of events on one issue collapses to the
# latest and an event on another issue is never dropped from the queue. A label
# event the job skips gets its own group, so it never replaces a pending run.
concurrency:
  group: >-
    prismatic-issue-triage-${{ github.event.issue.number || 'sweep' }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
    !(startsWith(github.event.label.name, 'severity:') || github.event.label.name == 'epic' ||
    github.event.label.name == 'automation: container-closed' ||
    contains(github.event.issue.labels.*.name, 'epic')) && '-skip' || '' }}
  cancel-in-progress: false

jobs:
  reconcile-issues:
    name: Reconcile issue project states
    # Label events run only for labels triage or containers read, or any label on an epic.
    if: >-
      github.repository == 'samlevin/prismatic' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      startsWith(github.event.label.name, 'severity:') ||
      github.event.label.name == 'epic' ||
      github.event.label.name == 'automation: container-closed' ||
      contains(github.event.issue.labels.*.name, 'epic'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out default-branch scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.0'
      - name: Triage issues and close finished containers
        env:
          PRISMATIC_PROJECT_TOKEN: ${{ secrets.PRISMATIC_PROJECT_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        # An issue event reconciles only that issue; the schedule and manual
        # runs sweep the whole project.
        run: |
          if [ "$GITHUB_EVENT_NAME" = issues ]; then set -- --issue "$ISSUE_NUMBER"; fi
          node scripts/issue-triage.mjs "$@"
          node scripts/issue-containers.mjs "$@"
