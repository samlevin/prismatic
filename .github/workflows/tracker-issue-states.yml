name: 'Tracker: reconcile issue states'
run-name: "Reconcile issue states (${{ github.event_name == 'issues' && format('issue #{0} {1}', github.event.issue.number, github.event.action) || github.event_name }})"

on:
  # Title and body edits change neither triage nor containers, so `edited`
  # starts no run. tracker-project-membership.yml triages a new issue once its
  # project item exists, so `opened` starts no run either.
  issues:
    types: [reopened, closed, labeled, unlabeled]
  # The hourly sweep adds open issues still missing from the project, then
  # catches project field and hierarchy changes, which have no Actions
  # trigger, and any issue event whose run was skipped.
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview project membership, metadata, and container completion without writes
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: "${{ github.event_name == 'issues' && format('issue-states-issue-{0}', github.event.issue.number) || 'issue-states-sweep' }}"
  cancel-in-progress: false

jobs:
  reconcile-issues:
    name: Reconcile issue project states
    # A label event runs only when the label can change triage or container
    # state: a severity label, `epic`, the container-closed marker, or any label
    # on an epic, whose conflicting labels triage removes.
    if: >-
      github.repository == 'samlevin/prismatic' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'issues' ||
      github.event.action == 'reopened' ||
      github.event.action == 'closed' ||
      startsWith(github.event.label.name, 'severity:') ||
      github.event.label.name == 'epic' ||
      github.event.label.name == 'automation: container-closed' ||
      contains(github.event.issue.labels.*.name, 'epic'))
    uses: agenticool/agenticool/.github/workflows/_tracker-issue-states.yml@tracker-v0.1.0
    with:
      token_env: 'PRISMATIC_PROJECT_TOKEN'
      issue: ${{ github.event.issue.number || 0 }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets:
      project_token: ${{ secrets.PRISMATIC_PROJECT_TOKEN }}
