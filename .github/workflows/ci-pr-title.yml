# Requires a Conventional Commits PR title. The squash commit takes the title,
# and Release Please derives versions and release notes from it.

name: 'CI: PR title'

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  # The main ruleset requires this job's name.
  check-pr-title:
    name: Check PR title follows Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
