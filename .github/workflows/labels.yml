name: Sync labels

on:
  pull_request:
    paths:
      - .github/labels.json
  push:
    branches: [main]
    paths:
      - .github/labels.json
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the label plan without writes
        type: boolean
        default: true

concurrency:
  group: prismatic-labels-sync-${{ github.event_name == 'pull_request' && github.ref || 'apply' }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.repository == 'samlevin/prismatic'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/labels.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Preview label plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/labels-sync.mjs --prune

  apply:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'samlevin/prismatic' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          sparse-checkout: |
            scripts
            .github/labels.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Sync labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/labels-sync.mjs --prune
          else
            node scripts/labels-sync.mjs --apply --prune
          fi
