name: 'Tracker: copy issue metadata to PR'
run-name: 'Copy linked issue metadata to PR #${{ github.event.pull_request.number || inputs.pull_request }}'

on:
  pull_request_target:
    types: [opened, edited, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to reconcile
        required: true
        type: string
      dry_run:
        description: Preview metadata without writes
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pr-issue-metadata-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: false

jobs:
  copy-issue-metadata:
    name: Copy linked issue labels, assignees, and milestone to PR
    # The command reads linked issues from the PR body and never the title,
    # so an edit that leaves the body unchanged starts no job.
    if: github.repository == 'samlevin/prismatic' && (github.event_name == 'pull_request_target' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (github.event.action != 'edited' || github.event.changes.body)
    uses: agenticool/agenticool/.github/workflows/_tracker-pr-metadata.yml@tracker-v0.1.0
    with:
      token_env: 'PRISMATIC_PROJECT_TOKEN'
      pull_request: ${{ fromJSON(github.event.pull_request.number || inputs.pull_request) }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets: inherit
