name: Branch name

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: read

jobs:
  branch-name:
    if: github.repository == 'samlevin/prismatic'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Execute trusted default-branch code, never the pull request's copy.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Check the branch name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ ! -f scripts/branch-name.mjs ]; then
            echo "scripts/branch-name.mjs is not on the default branch yet; skipping."
            exit 0
          fi
          node scripts/branch-name.mjs --check "$HEAD_REF" --require-issue
