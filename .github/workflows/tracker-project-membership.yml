name: 'Tracker: add issues to the project'
run-name: "${{ github.event_name == 'issues' && format('Add issue #{0} to Prismatic delivery', github.event.issue.number) || format('Add missing issues to Prismatic delivery ({0})', github.event_name) }}"

on:
  issues:
    types: [opened]
  # GitHub sometimes creates no run for an `opened` event, which never fires
  # again for that issue, so the hourly tracker-issue-states.yml sweep adds
  # every open issue still missing before it triages. A manual run here sweeps
  # project membership alone.
  workflow_dispatch:
    inputs:
      dry_run:
        description: List open issues missing from Prismatic delivery without adding them
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: "${{ github.event_name == 'issues' && format('project-membership-issue-{0}', github.event.issue.number) || 'project-membership-sweep' }}"
  cancel-in-progress: false

jobs:
  add-to-project:
    name: Add the new issue to Prismatic delivery
    if: github.event_name == 'issues' && github.repository == 'samlevin/prismatic'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Execute trusted default-branch code.
      - name: Check out default-branch scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
      - name: Add the issue to Prismatic delivery
        env:
          PRISMATIC_PROJECT_TOKEN: ${{ secrets.PRISMATIC_PROJECT_TOKEN }}
          CONTENT_TYPE: 'issue'
          CONTENT_NUMBER: ${{ github.event.issue.number }}
          DRY_RUN: 'false'
        run: node scripts/issue-project-membership.mjs
      # The item exists now, so this is the issue's first triage run.
      - name: Triage the new issue
        env:
          PRISMATIC_PROJECT_TOKEN: ${{ secrets.PRISMATIC_PROJECT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/issue-triage.mjs --apply --issue "$ISSUE_NUMBER"

  add-missing-issues:
    name: Add missing open issues to Prismatic delivery
    if: github.event_name != 'issues' && github.repository == 'samlevin/prismatic' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Execute trusted default-branch code.
      - name: Check out default-branch scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
      - name: Add missing open issues to Prismatic delivery
        env:
          PRISMATIC_PROJECT_TOKEN: ${{ secrets.PRISMATIC_PROJECT_TOKEN }}
          SWEEP: 'true'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node scripts/issue-project-membership.mjs
