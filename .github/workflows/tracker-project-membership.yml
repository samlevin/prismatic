name: 'Tracker: add issues to the project'
run-name: "${{ github.event_name == 'issues' && format('Add issue #{0} to the project', github.event.issue.number) || format('Add missing issues to the project ({0})', github.event_name) }}"

on:
  issues:
    types: [opened]
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the missing issues without adding them
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: project-membership-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  add-to-project:
    name: Add issues to the project
    if: github.repository == 'samlevin/prismatic' && (github.event_name == 'issues' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out default-branch scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: Add the issue to Prismatic delivery
        if: github.event_name == 'issues'
        env:
          PRISMATIC_PROJECT_TOKEN: ${{ secrets.PRISMATIC_PROJECT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DRY_RUN: 'false'
        run: node scripts/issue-project-membership.mjs
      - name: Add missing open issues to Prismatic delivery
        if: github.event_name != 'issues'
        env:
          PRISMATIC_PROJECT_TOKEN: ${{ secrets.PRISMATIC_PROJECT_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node scripts/issue-project-membership.mjs --sweep
