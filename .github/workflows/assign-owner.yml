name: Assign owner

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  assign:
    # The owner's identity is what the agents use. Nothing is checked out, so
    # pull_request_target never runs pull request code.
    if: >-
      github.event.sender.login == github.repository_owner &&
      (github.event_name == 'issues' ||
      github.event.pull_request.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assign the owner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = "issues" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-assignee "$OWNER"
          else
            gh pr edit "$PR_NUMBER" --add-assignee "$OWNER"
          fi
