# Native tools the `CI: supply-chain security` workflow downloads, in the
# docker/binaries.lock format. docker/fetch-pinned.sh refuses any file whose
# SHA-256 differs from the one recorded here. None of them enters the Action
# image.
#
# Fields, separated by spaces: name, version, platform, sha256, url.
#
